<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на свадьбу</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="bg-music" src="song.mp3" loop prefetch></audio>

    <!-- Кнопка управления музыкой -->
    <button id="music-toggle" class="music-btn pulse-animation" onclick="toggleMusic()">
        <svg class="icon-play" viewBox="0 0 24 24">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
        <svg class="icon-pause" viewBox="0 0 24 24" style="display: none;">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
    </button>

    <div class="main-content">
        
        <!-- Начальный блок -->
        <section class="page-block full-screen-block" id="envelope-block">
            <a href="#main-start" class="envelope-link" id="open-envelope">
                <img src="envelope.png" alt="Приглашение на свадьбу" class="envelope-img">
            </a>
        </section>

        <!-- Основной контент -->
        <div id="main-start" style="width: 100%;"></div>

        <section class="page-block">
            <img src="photo1.png" alt="Главное фото" class="taplink-img">
        </section>

        <section class="page-block">
            <img src="photo2.png" alt="Календарь" class="taplink-img">
        </section>

        <section class="page-block">
            <a href="https://yandex.ru/maps/org/u_soma/18575956865/?ll=41.112594%2C44.981157&z=14" target="_blank" class="map-link">
                <img src="photo3.png" alt="Место проведения" class="taplink-img">
            </a>
        </section>

        <section class="page-block">
            <img src="photo45.png" alt="Дополнительное фото" class="taplink-img">
        </section>

        <section class="page-block">
            <img src="photo4.png" alt="Тайминг дня" class="taplink-img">
        </section>

        <!-- 1. Фото перед анкетой и таймером -->
        <section class="page-block">
            <img src="photo9.png" alt="Фото перед анкетой" class="taplink-img">
        </section>

        <!-- 2. Блок анкеты -->
        <section class="page-block rsvp-section">
            <form class="rsvp-form" id="rsvpForm" onsubmit="return handleSubmit(event)">
                <div class="form-group">
                    <label for="guest-name" class="form-label">Ваши фамилия и имя</label>
                    <input type="text" id="guest-name" name="guest_name" class="form-input" placeholder="Введите имя и фамилию" required>
                </div>

                <div class="form-group">
                    <p class="form-label">Планируете ли вы присутствовать на свадьбе?</p>
                    <label class="radio-label">
                        <input type="radio" name="attendance" value="yes" required>
                        <span>Да, с удовольствием!</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="attendance" value="no">
                        <span>К сожалению, не смогу.</span>
                    </label>
                </div>

                <button type="submit" class="submit-btn">ОТПРАВИТЬ</button>
            </form>
        </section>

        <!-- 3. Блок таймера (после анкеты) -->
        <section class="page-block timer-section">
            <div class="timer-container">
                <div class="timer-title">До свадьбы осталось:</div>
                <div class="timer-display">
                    <div class="timer-block">
                        <span class="timer-number" id="days">00</span>
                        <span class="timer-label">ДНЕЙ</span>
                    </div>
                    <div class="timer-block">
                        <span class="timer-number" id="hours">00</span>
                        <span class="timer-label">часов</span>
                    </div>
                    <div class="timer-block">
                        <span class="timer-number" id="minutes">00</span>
                        <span class="timer-label">минут</span>
                    </div>
                    <div class="timer-block">
                        <span class="timer-number" id="seconds">00</span>
                        <span class="timer-label">секунд</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="page-block">
            <img src="off.png" alt="Финальное фото" class="taplink-img">
        </section>

    </div>

    <script>
        // --- 1. ЛОГИКА МУЗЫКИ И КЛИКА ПО КОНВЕРТУ ---
        const audio = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-toggle');
        const iconPlay = document.querySelector('.icon-play');
        const iconPause = document.querySelector('.icon-pause');
        const openEnvelopeBtn = document.getElementById('open-envelope');

        function updateUI(isPlaying) {
            if (isPlaying) {
                iconPlay.style.display = 'none';
                iconPause.style.display = 'block';
                musicBtn.classList.remove('pulse-animation');
            } else {
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
                musicBtn.classList.add('pulse-animation');
            }
        }

        window.toggleMusic = function() {
            if (audio.paused) {
                if (audio.currentTime === 0) {
                    audio.currentTime = 33;
                }
                audio.play().then(() => {
                    updateUI(true);
                }).catch(e => console.log("Браузер заблокировал звук:", e));
            } else {
                audio.pause();
                updateUI(false);
            }
        };

        if (openEnvelopeBtn) {
            openEnvelopeBtn.addEventListener('click', function(e) {
                e.preventDefault();

                if (audio.paused) {
                    audio.currentTime = 33;
                    audio.play().then(() => {
                        updateUI(true);
                    }).catch(err => console.log("Ошибка воспроизведения:", err));
                }

                const target = document.getElementById('main-start');
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        }

        // --- 2. ОБРАБОТКА ФОРМЫ АНКЕТЫ ---
        function handleSubmit(event) {
            event.preventDefault();
            alert('Спасибо за ваш ответ!');
            document.getElementById('rsvpForm').reset();
            return false;
        }

        // --- 3. ЛОГИКА ТАЙМЕРА (26.09.2026 12:00) ---
        (function() {
            const countDownDate = new Date(2026, 8, 26, 12, 0, 0).getTime();

            function updateTimer() {
                const now = new Date().getTime();
                const distance = countDownDate - now;

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                const dEl = document.getElementById("days");
                const hEl = document.getElementById("hours");
                const mEl = document.getElementById("minutes");
                const sEl = document.getElementById("seconds");

                if (dEl && hEl && mEl && sEl) {
                    if (distance < 0) {
                        clearInterval(timerInterval);
                        dEl.innerText = "00"; hEl.innerText = "00"; mEl.innerText = "00"; sEl.innerText = "00";
                        const displayEl = document.querySelector(".timer-display");
                        if (displayEl) {
                            displayEl.innerHTML = "<span style='font-size: 24px; font-family: \"Forum\", serif;'>Событие началось!</span>";
                        }
                    } else {
                        dEl.innerText = days < 10 ? "0" + days : days;
                        hEl.innerText = hours < 10 ? "0" + hours : hours;
                        mEl.innerText = minutes < 10 ? "0" + minutes : minutes;
                        sEl.innerText = seconds < 10 ? "0" + seconds : seconds;
                    }
                }
            }
            updateTimer();
            const timerInterval = setInterval(updateTimer, 1000);
        })();
    </script>
</body>
</html>
