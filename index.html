<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на свадьбу</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="no-scroll">

    <!-- ФОНОВАЯ МУЗЫКА -->
    <audio id="bg-music" src="song.mp3" loop prefetch></audio>

    <!-- КНОПКА МУЗЫКИ -->
    <button id="music-toggle" class="music-btn pulse-animation" onclick="toggleMusic()">
        <svg class="icon-play" viewBox="0 0 24 24">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
        <svg class="icon-pause" viewBox="0 0 24 24" style="display: none;">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
    </button>

    <!-- ОВЕРЛЕЙ-КОНВЕРТ (ПОВЕРХ ВСЕГО САЙТА) -->
    <div id="envelope-overlay" class="envelope-overlay" onclick="openEnvelope()">
        <img src="envelope.png" alt="Конверт" class="envelope-img">
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ САЙТА -->
    <div class="main-content">
        
        <section class="page-block">
            <img src="photo1.png" alt="Главное фото" class="taplink-img">
        </section>

        <section class="page-block">
            <img src="photo2.png" alt="Календарь" class="taplink-img">
        </section>

        <section class="page-block">
            <a href="https://yandex.ru/maps/org/dvorets_brakosochetaniya/1017085378/?ll=50.122193%2C53.207982&z=16" class="map-link">
                <img src="photo3.png" alt="Место проведения" class="taplink-img">
            </a>
        </section>

        <section class="page-block">
             <a href="https://yandex.ru/maps/51/samara/house/alma_atinskaya_ulitsa_183/YUkYdAFmQEUEQFtpfX50dX9nZw==/?ll=50.266903%2C53.254343&z=16" class="map-link">
                <img src="photo45.png" alt="Дополнительное фото" class="taplink-img">
             </a>
        </section>

        <section class="page-block">
            <img src="photo4.png" alt="Тайминг дня" class="taplink-img">
        </section>

        <!-- Фото перед анкетой -->
        <section class="page-block">
            <img src="photo9.png" alt="Фото перед анкетой" class="taplink-img">
        </section>

        <!-- ИЗОБРАЖЕНИЕ АНКЕТЫ -->
        <section class="page-block">
            <img src="anketa.png" alt="Анкета" class="taplink-img">
        </section>

        <!-- АНКЕТА -->
        <section class="page-block rsvp-section">
            <form class="rsvp-form" id="rsvpForm" onsubmit="return handleSubmit(event)">
                <div class="form-group">
                    <label for="guest-name" class="form-label">Ваши фамилия и имя</label>
                    <input type="text" id="guest-name" name="guest_name" class="form-input" placeholder="Введите имя и фамилию" required>
                </div>

                <div class="form-group">
                    <p class="form-label">Планируете ли вы присутствовать на свадьбе?</p>
                    <label class="radio-label">
                        <input type="radio" name="attendance" value="yes" required>
                        <span>Да, с удовольствием!</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="attendance" value="no">
                        <span>К сожалению, не смогу.</span>
                    </label>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">ОТПРАВИТЬ</button>
            </form>
        </section>

        <!-- ТАЙМЕР -->
        <section class="page-block timer-section">
            <div class="timer-container">
                <div class="timer-title">До свадьбы осталось:</div>
                <div class="timer-display">
                    <div class="timer-block">
                        <span class="timer-number" id="days">00</span>
                        <span class="timer-label">ДНЕЙ</span>
                    </div>
                    <div class="timer-block">
                        <span class="timer-number" id="hours">00</span>
                        <span class="timer-label">часов</span>
                    </div>
                    <div class="timer-block">
                        <span class="timer-number" id="minutes">00</span>
                        <span class="timer-label">минут</span>
                    </div>
                    <div class="timer-block">
                        <span class="timer-number" id="seconds">00</span>
                        <span class="timer-label">секунд</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="page-block">
            <img src="off.png" alt="Финальное фото" class="taplink-img">
        </section>

    </div>

    <script>
        const audio = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-toggle');
        const iconPlay = document.querySelector('.icon-play');
        const iconPause = document.querySelector('.icon-pause');

        // Открытие конверта + включение музыки
        function openEnvelope() {
            const overlay = document.getElementById('envelope-overlay');
            
            // Включаем музыку
            if (audio) {
                audio.currentTime = 33;
                audio.play().then(() => {
                    updateUI(true);
                }).catch(e => console.log("Ошибка воспроизведения:", e));
            }

            // Плавное исчезновение конверта
            overlay.classList.add('hidden');
            
            // Разрешаем прокрутку сайта
            document.body.classList.remove('no-scroll');

            // Удаляем конверт из DOM после анимации
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 600);
        }

        function updateUI(isPlaying) {
            if (isPlaying) {
                iconPlay.style.display = 'none';
                iconPause.style.display = 'block';
                musicBtn.classList.remove('pulse-animation');
            } else {
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
                musicBtn.classList.add('pulse-animation');
            }
        }

        window.toggleMusic = function() {
            if (audio.paused) {
                if (audio.currentTime === 0) audio.currentTime = 33;
                audio.play().then(() => updateUI(true)).catch(e => console.log(e));
            } else {
                audio.pause();
                updateUI(false);
            }
        };

        // ОТПРАВКА ФОРМЫ В VK БОТА ЧЕРЕЗ CLOUDFLARE WORKER
        async function handleSubmit(event) {
            event.preventDefault();

            const form = document.getElementById('rsvpForm');
            const submitBtn = document.getElementById('submitBtn');
            
            const guestName = document.getElementById('guest-name').value.trim();
            const attendanceValue = form.querySelector('input[name="attendance"]:checked')?.value;
            
            const attendanceText = attendanceValue === 'yes' 
                ? '✅ Да, с удовольствием!' 
                : '❌ К сожалению, не смогу.';

            const messageText = `📩 Новая анкета на свадьбу!\n\n👤 Гость: ${guestName}\nПрисутствие: ${attendanceText}`;

            // Меняем статус кнопки во время отправки
            submitBtn.disabled = true;
            submitBtn.textContent = 'ОТПРАВКА...';

            try {
                const response = await fetch('https://vk-bot-worker.awsjfe.workers.dev/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: messageText })
                });

                if (response.ok) {
                    alert('Спасибо за ваш ответ!');
                    form.reset();
                } else {
                    alert('Произошла ошибка при отправке. Попробуйте еще раз.');
                }
            } catch (error) {
                console.error('Ошибка отправки:', error);
                alert('Не удалось отправить ответ. Проверьте подключение к интернету.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'ОТПРАВИТЬ';
            }

            return false;
        }

        // ТАЙМЕР (26.09.2026 12:00)
        (function() {
            const countDownDate = new Date(2026, 8, 26, 12, 0, 0).getTime();

            function updateTimer() {
                const now = new Date().getTime();
                const distance = countDownDate - now;

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                const dEl = document.getElementById("days");
                const hEl = document.getElementById("hours");
                const mEl = document.getElementById("minutes");
                const sEl = document.getElementById("seconds");

                if (dEl && hEl && mEl && sEl) {
                    if (distance < 0) {
                        clearInterval(timerInterval);
                        dEl.innerText = "00"; hEl.innerText = "00"; mEl.innerText = "00"; sEl.innerText = "00";
                    } else {
                        dEl.innerText = days < 10 ? "0" + days : days;
                        hEl.innerText = hours < 10 ? "0" + hours : hours;
                        mEl.innerText = minutes < 10 ? "0" + minutes : minutes;
                        sEl.innerText = seconds < 10 ? "0" + seconds : seconds;
                    }
                }
            }
            updateTimer();
            const timerInterval = setInterval(updateTimer, 1000);
        })();
    </script>
</body>
</html>
